name: deploy-registry

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy registry-service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP=/home/ubuntu/AgroPilot-App
            SVC=$APP/services/registry-service

            # 1. Code: clone on the first run, then check out this run's commit.
            if [ ! -d "$APP/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP"
            fi
            cd "$APP"
            git fetch origin main
            git reset --hard ${{ github.sha }}

            # 2. Tools: install uv and Docker only if they are missing.
            if [ ! -x /home/ubuntu/.local/bin/uv ]; then
              curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
            fi
            if ! command -v docker >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi

            # 3. PostgreSQL in Docker. The named volume keeps the data.
            if ! sudo docker ps -a --format '{{.Names}}' | grep -qx postgres; then
              sudo docker run -d --name postgres --restart unless-stopped \
                -e POSTGRES_USER=registry \
                -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
                -e POSTGRES_DB=registry \
                -v pgdata:/var/lib/postgresql/data \
                -p 127.0.0.1:5432:5432 \
                postgres:17 \
                || { sudo docker rm -f postgres; exit 1; }
            fi
            sudo docker start postgres
            for i in $(seq 1 30); do
              sudo docker exec postgres pg_isready -h 127.0.0.1 -U registry -d registry && break
              sleep 1
            done

            # 4. .env: written from scratch on every run, never appended.
            cat > "$SVC/.env" <<EOF
            DATABASE_URL=postgresql://registry:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/registry
            EOF

            # 5. Dependencies, and seed only an empty database (seeding drops the tables).
            cd "$SVC"
            /home/ubuntu/.local/bin/uv sync --locked
            if [ -z "$(sudo docker exec postgres psql -U registry -d registry -tAc "SELECT to_regclass('public.plots')")" ]; then
              /home/ubuntu/.local/bin/uv run python seed_postgres.py
            fi

            # 6. systemd unit from the repo.
            sudo cp registry.service /etc/systemd/system/registry.service
            sudo systemctl daemon-reload
            sudo systemctl enable registry.service
            sudo systemctl restart registry.service

            # 7. Health check: a service that crashes on startup turns the job red.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
              sleep 2
            done
            sudo journalctl -u registry.service -n 50 --no-pager
            exit 1
